<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoSignal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-utility">
        <button id="text-size-btn" class="icon-btn" title="Change text size">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12L5.5 3l3.5 9" />
            <path d="M3 9h5" />
            <path d="M10 12h4" />
            <path d="M12 12V7" />
          </svg>
        </button>
        <button id="saved-btn" class="icon-btn" title="Saved articles">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
            <path d="M3.5 2h9v12l-4.5-3-4.5 3v-12z"/>
          </svg>
          <span id="saved-btn-count" class="icon-btn-label"></span>
        </button>
        <button id="profile-btn" class="icon-btn" title="Your profile">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="5.5" r="2.6"/>
            <path d="M2.7 13.8c0-2.7 2.2-4.3 5.3-4.3s5.3 1.6 5.3 4.3"/>
          </svg>
          <span id="profile-btn-text" class="icon-btn-label"></span>
        </button>
        <label class="annotate-toggle" title="Annotate mode — click highlighted terms for explanations">
          <input type="checkbox" id="annotate-toggle" checked>
          <span class="annotate-slider"></span>
          <span class="annotate-label">Annotate</span>
        </label>
      </div>

      <div class="masthead">
        <div class="masthead-logo">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="22" cy="22" r="18" />
            <ellipse cx="22" cy="22" rx="18" ry="7.5" />
            <path d="M22 4c5 5 5 31 0 36" />
            <path d="M22 4c-5 5-5 31 0 36" />
            <line x1="4" y1="22" x2="40" y2="22" />
          </svg>
        </div>
        <h1>GeoSignal</h1>
        <div class="masthead-tagline">
          <span class="masthead-rule"></span>
          <span class="live-dot" title="Live feed"></span>
          <span class="masthead-tagline-text">A Global Intelligence Dispatch</span>
          <span class="masthead-rule"></span>
        </div>
      </div>
    </header>

    <div class="control-bar">
      <div class="search-bar">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="6" cy="6" r="4.5"/>
          <path d="M9.5 9.5L13 13"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search topics, people, sources..." />
        <button id="search-clear" class="search-clear" style="display:none">&times;</button>
      </div>

      <button class="filters-toggle" id="filters-toggle" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M1 3h12M3 7h8M5 11h4"/>
        </svg>
        <span id="filters-summary">Global</span>
      </button>

      <button id="refresh-btn" class="refresh-btn" type="button" title="Click to load articles based on your current filter selections. Do not use your browser's refresh button — that will reset your filters.">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 8.5a6 6 0 1 1 1.3 3.8"/>
          <path d="M1.5 4v3.5H5"/>
        </svg>
        <span class="refresh-btn-label">Refresh results</span>
      </button>
      <span class="refresh-confirmation" id="refresh-confirmation" aria-live="polite">Results updated</span>
    </div>

    <div class="filters" id="filters-container">
      <div class="filters-body" id="filters-body">
      <div class="filter-group">
        <label for="region-select">Region</label>
        <select id="region-select">
          <option value="Global">Global</option>
          <option value="Middle East">Middle East</option>
          <option value="South Asia">South Asia</option>
          <option value="Southeast Asia">Southeast Asia</option>
          <option value="Europe">Europe</option>
          <option value="Africa">Africa</option>
          <option value="Latin America">Latin America</option>
          <option value="East Asia">East Asia</option>
          <option value="North America">North America</option>
          <option value="Central Asia & Caucasus">Central Asia & Caucasus</option>
          <option value="Oceania">Oceania</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Sectors</label>
        <div class="pill-group" id="sector-pills">
          <button class="pill active" data-value="Geopolitics">Geopolitics</button>
          <button class="pill active" data-value="Economy & Trade">Economy & Trade</button>
          <button class="pill active" data-value="Technology & AI">Technology & AI</button>
          <button class="pill active" data-value="Climate & Energy">Climate & Energy</button>
          <button class="pill active" data-value="Defence & Security">Defence & Security</button>
          <button class="pill active" data-value="Society & Culture">Society & Culture</button>
          <button class="pill active" data-value="Space & Frontier">Space & Frontier</button>
          <button class="pill active" data-value="Health & Biotech">Health & Biotech</button>
        </div>
      </div>

      <div class="filter-group">
        <label>Sources</label>
        <div class="pill-group" id="source-pills">
          <button class="pill active" data-value="Mainstream news">Mainstream</button>
          <button class="pill active" data-value="Think tanks & academic">Think Tanks</button>
          <button class="pill active" data-value="Independent journalism">Independent</button>
          <button class="pill pill-official" data-value="Official statements">Official</button>
        </div>
      </div>
      </div>
    </div>

    <div class="dispatch-header" id="dispatch-header">
      <div class="dispatch-date" id="dispatch-date"></div>
      <div class="dispatch-ornament">&#x25C6;</div>
      <div class="dispatch-title">Today&rsquo;s Dispatch</div>
    </div>

    <div class="stats-strip" id="stats-strip"></div>

    <main id="feed">
      <div class="loading-feed">
        <div class="loading-pulse"></div>
        <span>Gathering today&rsquo;s stories&hellip;</span>
      </div>
    </main>

    <footer>
      <span id="feed-count"></span>
      <span id="feed-timestamp"></span>
    </footer>
  </div>

  <!-- Profile Setup Modal -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Your Profile</h2>
        <p class="modal-subtitle">Personalize your intelligence feed. GeoSignal will analyze how each story impacts you specifically.</p>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="profile-role">What's your role?</label>
          <select id="profile-role">
            <option value="">Select your role...</option>
            <option value="Analyst">Analyst</option>
            <option value="Entrepreneur">Entrepreneur / Founder</option>
            <option value="Investor">Investor / VC / PE</option>
            <option value="Executive">Executive / C-Suite</option>
            <option value="VP">VP / Director</option>
            <option value="Consultant">Consultant / Advisor</option>
            <option value="Journalist">Journalist / Reporter</option>
            <option value="Researcher">Researcher / Academic</option>
            <option value="Policy Maker">Policy Maker / Government</option>
            <option value="Engineer">Engineer / Developer</option>
            <option value="Student">Student</option>
            <option value="Personal">Personal Use</option>
          </select>
        </div>

        <div class="form-group">
          <label for="profile-industry">Industry / Sector</label>
          <select id="profile-industry">
            <option value="">Select your industry...</option>
            <option value="Finance & Banking">Finance & Banking</option>
            <option value="Oil & Gas / Energy">Oil & Gas / Energy</option>
            <option value="Technology">Technology</option>
            <option value="Healthcare & Pharma">Healthcare & Pharma</option>
            <option value="Defense & Aerospace">Defense & Aerospace</option>
            <option value="Real Estate">Real Estate</option>
            <option value="Agriculture & Food">Agriculture & Food</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Logistics & Supply Chain">Logistics & Supply Chain</option>
            <option value="Media & Communications">Media & Communications</option>
            <option value="Government & Public Sector">Government & Public Sector</option>
            <option value="Education">Education</option>
            <option value="Consulting">Consulting</option>
            <option value="Legal">Legal</option>
            <option value="Retail & Consumer">Retail & Consumer</option>
            <option value="General / Multiple">General / Multiple</option>
          </select>
        </div>

        <div class="form-group">
          <label for="profile-location">Where are you based?</label>
          <input type="text" id="profile-location" placeholder="e.g., Singapore, New York, London..." />
        </div>

        <div class="form-group">
          <label for="profile-focus">What do you focus on? <span class="optional">(optional)</span></label>
          <input type="text" id="profile-focus" placeholder="e.g., emerging markets, supply chain risk, ESG..." />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" id="profile-clear">Clear Profile</button>
        <button class="btn-primary" id="profile-save">Save Profile</button>
      </div>
    </div>
  </div>

  <div class="annotate-popup" id="annotate-popup">
    <button class="annotate-popup-close" id="annotate-popup-close">&times;</button>
    <div class="annotate-popup-body" id="annotate-popup-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
